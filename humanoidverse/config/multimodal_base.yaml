# @package _global_

defaults:
  - base
  - env/multimodal_motion_tracking
  - algo/multimodal_ppo
  - obs: motion_tracking/main
  - rewards: motion_tracking/main
  - robot: g1/g1_23dof_lock_wrist
  - simulator: isaacgym
  - domain_rand: main
  - terrain: terrain_locomotion_plane
  - _self_

# Override global variables for multimodal learning
project_name: MULTIMODAL_MOTION_FUSION
experiment_name: multimodal_learning
log_task_name: MULTIMODAL

# Simulation parameters
num_envs: 4096  # Reduced for multimodal complexity
max_episode_length_s: 30  # Shorter episodes for faster switching

# Training parameters
save_interval: 500
logging_interval: 50
eval_interval: 250

# Inherit all base configurations
seed: 0
codebase_version: 1.0
headless: True

### Checkpoint logic
auto_load_latest: False
checkpoint: null

### Naming and dir structure
base_dir: logs
timestamp: ${now:%Y%m%d_%H%M%S}
experiment_dir: ${base_dir}/${project_name}/${timestamp}-${experiment_name}-${log_task_name}-${robot.asset.robot_type}
save_dir: ${experiment_dir}/.hydra

force_flat_terrain: False

use_wandb: True

### Simulation
sim_type: isaacgym
env_spacing: 20
output_dir: ${experiment_dir}/output

eval_overrides:
  headless: False
  num_envs: 1
  auto_load_latest: False
  use_wandb: True

# Robot motion configuration
robot:
  motion:
    motion_file: "/home/js/xiaofengzi/PBHC/smpl_retarget/retargeted_motion_data/mink/B2 - walk to stand_poses.pkl"  # Default motion file

# Multimodal specific parameters (只训练太极+拳击)
multimodal:
  # Motion types to learn
  motion_types:
    - walk
    - run
  
  # Training phases (针对太极+拳击优化)
  training_phases:
    pretraining:
      enable: True
      num_iterations: 8000      # 减少预训练时间
      single_motion_per_env: True
      curriculum_learning: False
    
    multimodal:
      enable: True
      num_iterations: 25000     # 专注于双运动融合
      motion_switching: True
      fusion_learning: True
      curriculum_learning: True
  
  # Fusion parameters
  fusion:
    latent_dim: 128
    temperature: 1.0
    smooth_transition_steps: 30
    compatibility_threshold: 0.3
    quality_threshold: 0.7
  
  # Curriculum learning
  curriculum:
    enable: True
    initial_difficulty: 0.1
    max_difficulty: 1.0
    difficulty_step: 0.02
    success_rate_threshold: 0.8
    failure_rate_threshold: 0.3
  
  # Evaluation (只评估太极+拳击融合)
  evaluation:
    motion_combinations: 
      - ["walk", "run"]      # 太极马步 + 拳击勾拳
    
    metrics:
      - motion_similarity
      - fusion_quality
      - transition_smoothness
      - success_rate
      - reward_consistency

# Data paths
data_paths:
  motion_data_dir: "/home/js/xiaofengzi/PBHC/smpl_retarget/retargeted_motion_data/mink"
  pretrained_models_dir: "innovation_multimodal/pretrained"
  output_dir: "${experiment_dir}/multimodal_output"

# Logging
wandb:
  wandb_entity: null  # Set your wandb entity
  wandb_dir: ${experiment_dir}/wandb
  tags: ["multimodal", "motion_fusion", "innovation"]
  group: "multimodal_learning"
