# @package _global_

algo:
  _target_: innovation_multimodal.multimodal_ppo.MultimodalPPO
  _recursive_: False
  config:
    # Base PPO parameters
    num_learning_epochs: 8
    num_mini_batches: 8
    clip_param: 0.2
    gamma: 0.99
    lam: 0.95
    value_loss_coef: 1.0
    entropy_coef: 0.01
    
    # Learning rates
    actor_learning_rate: 5.e-4
    critic_learning_rate: 5.e-4
    motion_encoder_learning_rate: 1.e-4
    fusion_controller_learning_rate: 1.e-4
    
    max_grad_norm: 1.0
    use_clipped_value_loss: True
    schedule: "adaptive"
    desired_kl: 0.01
    
    num_steps_per_env: 32
    save_interval: 500
    logging_interval: 25
    
    load_optimizer: True
    
    init_noise_std: 0.8
    
    num_learning_iterations: 35000  # 8000预训练 + 25000融合 + 2000微调
    init_at_random_ep_len: True
    
    # Phase embedding (inherited from base PPO)
    phase_embed:
      type: Original
      dim: 16
    
    # Module configuration (required by base algorithm)
    module_dict:
      actor: 
        input_dim: [actor_obs]
        output_dim: [robot_action_dim]
        layer_config:
          type: MLP
          hidden_dims: [512, 256, 128]
          activation: ELU
      critic:
        type: MLP
        input_dim: [critic_obs]
        output_dim: [num_rew_fn]
        layer_config:
          type: MLP
          hidden_dims: [768, 512, 128]
          activation: ELU
    
    # Multimodal specific parameters (太极+拳击专用)
    multimodal_config:
      # Training phases
      pretraining_phase:
        enabled: True
        num_iterations: 8000      # 减少预训练时间
        single_motion_training: True
        freeze_fusion_controller: True
        
      multimodal_phase:
        enabled: True
        num_iterations: 25000     # 专注于太极+拳击融合
        motion_encoder_training: True
        fusion_controller_training: True
        multi_expert_training: True
      
      # Multi-expert architecture (只需要2个专家)
      multi_expert:
        num_experts: 2  # 太极专家 + 拳击专家
        expert_hidden_dims: [512, 256, 128]
        shared_encoder_dims: [256, 128]
        gating_network_dims: [128, 64]
        
        # Expert specialization
        expert_specialization_weight: 0.4  # 增强专门化
        diversity_loss_weight: 0.1
        
      # Motion encoder integration
      motion_encoder:
        latent_dim: 128
        reconstruction_weight: 1.0
        kl_divergence_weight: 0.5
        classification_weight: 0.8
        compatibility_weight: 0.3
        
        # Training schedule
        warmup_iterations: 5000
        encoder_update_frequency: 4
        
      # Fusion controller integration  
      fusion_controller:
        fusion_loss_weight: 0.5
        transition_smoothness_weight: 0.3
        quality_prediction_weight: 0.2
        
        # Update schedule
        controller_update_frequency: 2
        quality_prediction_training: True
        
      # Loss weights scheduling
      loss_scheduling:
        motion_tracking_weight:
          initial: 1.0
          final: 0.6
          schedule_type: "linear"
          
        fusion_quality_weight:
          initial: 0.1
          final: 0.4
          schedule_type: "exponential"
          
        innovation_bonus_weight:
          initial: 0.0
          final: 0.2
          schedule_type: "sigmoid"
    
    # Evaluation callbacks (设置为null避免格式错误)
    eval_callbacks: null
    
    # Advanced training techniques
    training_techniques:
      # Gradient penalty for stability
      gradient_penalty:
        enabled: True
        weight: 0.1
        
      # Spectral normalization
      spectral_normalization:
        enabled: True
        apply_to: ["gating_network", "expert_networks"]
        
      # Progressive training (针对太极+拳击优化)
      progressive_training:
        enabled: True
        start_with_compatible_pairs: False  # 太极+拳击是挑战性组合
        add_motion_every_n_iterations: 4000  # 更快的进度
        
      # Experience replay for multimodal samples  
      experience_replay:
        enabled: True
        buffer_size: 5000   # 减少缓冲区大小
        replay_ratio: 0.3   # 增加重放比例
        prioritized_sampling: True
